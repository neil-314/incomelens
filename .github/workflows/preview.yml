name: Temporary Vercel preview
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes vercel@63.1.2 deploy --temporary --yes --json > preview.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vercel-preview-result
          path: preview.json
          retention-days: 7
