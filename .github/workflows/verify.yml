name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_pipeline.py tests/test_server.py
      - run: python -m ruff check app.py pipeline.py plaid.py views.py tests
      - run: python -m playwright install --with-deps chromium
      - run: python -m uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/incomelens.log 2>&1 &
      - run: python -m pytest tests/test_browser.py
